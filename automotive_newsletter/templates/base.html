<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Automotive 뉴스레터{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css').path }}?v=20260829-sources">

    <script defer src="{{ url_for('static', path='app.js').path }}?v=20260829-sources"></script>
  </head>

    {% block body %}{% endblock %}
  </body>
</html>
