[project]
name = "automotive-newsletter"
version = "0.1.0"
description = "Korean automotive newsletter web app with daily history and email sending"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "feedparser>=6.0",
  "httpx>=0.27",
  "jinja2>=3.1",
  "python-dotenv>=1.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
automotive-newsletter = "automotive_newsletter.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
automotive_newsletter = ["templates/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

