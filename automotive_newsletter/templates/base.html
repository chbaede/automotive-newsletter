<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Automotive 뉴스레터 - 글로벌 자동차 및 SDV 브리핑{% endblock %}</title>
    <meta name="description" content="글로벌 완성차(OEM), 부품사(Tier 1), SDV 소프트웨어 및 컨퍼런스 핵심 뉴스를 선별하여 매일 전달하는 자동차 전문 브리핑 뉴스레터입니다.">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="Automotive 뉴스레터">
    <meta property="og:description" content="글로벌 완성차, 부품사, SDV 소프트웨어 및 자동차 컨퍼런스 매일 브리핑">
    <meta property="og:type" content="website">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6854824605420161" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css').path }}?v=20260829-sources">
    <script>
      if (localStorage.getItem("preferred_lang") === "en") {
        document.documentElement.classList.add("lang-en-active");
      }
    </script>
    <script defer src="https://unpkg.com/lucide@latest"></script>
    <script defer src="{{ url_for('static', path='app.js').path }}?v=20260829-sources"></script>
  </head>
  <body>
    {% block body %}{% endblock %}
  </body>
</html>
